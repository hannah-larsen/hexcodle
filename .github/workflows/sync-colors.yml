name: Sync Colors

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch: 

jobs:
  sync_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run sync script
        # You can change the number here if you want a different buffer
        run: npm run sync-colors -- 50

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the specific files changed by the script
          git add src/lib/colors.json src/lib/mini-colors.json || echo "Files not found"
          
          # Check if there are any changes to commit. If there are, commit and push them.
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync color names [skip ci]"
            git push
          else
            echo "No new colors to sync."
          fi
